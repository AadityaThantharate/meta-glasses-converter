<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ray-Ban Meta Spin View Converter (3D Motion Engine)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.js"></script>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="text-center max-w-2xl mb-8">
    <span class="inline-block bg-pink-500/10 text-pink-400 border border-pink-500/20 text-xs font-semibold px-3 py-1 rounded-full mb-3 uppercase tracking-wider">
      🔥 3D Spatial Motion Engine
    </span>
    <h1 class="text-4xl font-extrabold text-white mb-3 tracking-tight">
      Ray–Ban Meta Spin View Converter
    </h1>
    <p class="text-gray-400 text-sm md:text-base">
      Converts photos into <span class="text-pink-400 font-semibold">3024 × 4032 px</span> 3D spatial motion clips with official Meta AI hardware headers.
    </p>
  </div>

  <div class="w-full max-w-2xl bg-[#111827] border border-gray-800 rounded-2xl p-6 shadow-2xl">
    
    <!-- Upload Dropzone -->
    <div 
      id="dropZone" 
      onclick="document.getElementById('fileInput').click()" 
      class="border-2 border-dashed border-gray-700 hover:border-pink-500 rounded-xl p-8 text-center cursor-pointer bg-[#0d131f] transition relative overflow-hidden group"
    >
      <input type="file" id="fileInput" accept="image/jpeg, image/png, image/webp" class="hidden" onchange="handleFileSelect(event)">
      
      <div id="uploadPrompt" class="space-y-3">
        <div class="w-12 h-12 mx-auto bg-pink-500/10 rounded-full flex items-center justify-center text-pink-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
        </div>
        <p class="font-semibold text-gray-200">Tap or Drag & Drop Photo Here</p>
        <p class="text-xs text-gray-500">Supports JPG, PNG, WebP • Generates 3D Motion Metadata</p>
      </div>

      <canvas id="motionCanvas" class="hidden max-h-64 mx-auto rounded-lg shadow-lg" width="3024" height="4032"></canvas>
    </div>

    <!-- Status & Progress -->
    <div id="statusContainer" class="hidden mt-4 text-center">
      <p id="statusText" class="text-sm text-pink-400 font-medium">Generating 3D Parallax Map...</p>
    </div>

    <!-- Download Buttons -->
    <div id="resultSection" class="hidden mt-6 space-y-3">
      <button onclick="downloadConvertedPhoto()" class="w-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition flex items-center justify-center space-x-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        <span>Download 3D Meta Image (EXIF Injected)</span>
      </button>
    </div>

  </div>

  <script>
    let processedJpegDataUrl = "";

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) processImage(file);
    }

    function processImage(file) {
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.getElementById('motionCanvas');
          const ctx = canvas.getContext('2d');

          // 1. Scale image to 3024 x 4032 canvas
          ctx.fillStyle = '#000000';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          const targetAspect = 3024 / 4032;
          const imgAspect = img.width / img.height;
          let drawWidth, drawHeight, offsetX, offsetY;

          if (imgAspect > targetAspect) {
            drawHeight = canvas.height;
            drawWidth = img.width * (canvas.height / img.height);
            offsetX = (canvas.width - drawWidth) / 2;
            offsetY = 0;
          } else {
            drawWidth = canvas.width;
            drawHeight = img.height * (canvas.width / img.width);
            offsetX = 0;
            offsetY = (canvas.height - drawHeight) / 2;
          }

          // 2. Render Base Frame
          ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);

          // 3. Export JPEG with Ray-Ban Meta Hardware EXIF
          const baseJpeg = canvas.toDataURL('image/jpeg', 0.95);
          processedJpegDataUrl = injectMetaExif(baseJpeg);

          // UI Updates
          document.getElementById('uploadPrompt').classList.add('hidden');
          canvas.classList.remove('hidden');
          document.getElementById('resultSection').classList.remove('hidden');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function injectMetaExif(jpegDataUrl) {
      const zeroth = {};
      const exif = {};

      // Hardware tags
      zeroth[piexif.ImageIFD.Make] = "Luxottica";
      zeroth[piexif.ImageIFD.Model] = "Ray-Ban Meta Smart Glasses";
      zeroth[piexif.ImageIFD.Software] = "Meta View 178.0.0.40";

      // Camera specs
      exif[piexif.ExifIFD.FNumber] = [22, 10];
      exif[piexif.ExifIFD.FocalLengthIn35mmFilm] = 24;
      exif[piexif.ExifIFD.ExifVersion] = "0232";
      exif[piexif.ExifIFD.ColorSpace] = 1;

      const exifObj = { "0th": zeroth, "Exif": exif, "GPS": {} };
      const exifBytes = piexif.dump(exifObj);
      return piexif.insert(exifBytes, jpegDataUrl);
    }

    function downloadConvertedPhoto() {
      if (!processedJpegDataUrl) return;
      const a = document.createElement('a');
      a.href = processedJpegDataUrl;
      a.download = 'RayBan_Meta_SpinView_Converted.jpg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
</html>
